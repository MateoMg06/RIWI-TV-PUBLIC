services:
  app:
    build: ./app
    container_name: ${APP_CONTAINER_NAME:-riwi-cine-app}
    working_dir: /usr/src/app
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - ./app:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    env_file:
      - ./.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-riwi_db}
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-0.5}"
          memory: ${APP_MEM_LIMIT:-512M}
    networks:
      - backend

  db:
    image: postgres:15-alpine
    container_name: ${DB_CONTAINER_NAME:-riwi-cine-db}
    restart: always
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-riwi_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-0.5}"
          memory: ${DB_MEM_LIMIT:-512M}
    networks:
      - backend

volumes:
  db_data:
  node_modules:

networks:
  backend:
    driver: bridge